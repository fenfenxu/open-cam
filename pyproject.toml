[project]
name = "open-cam"
version = "0.2.0"
description = "摄像头视频流分析与监控管理工具"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "opencv-python-headless",
    "ultralytics",
    "sqlalchemy",
    "alembic",
    "platformdirs",
    "pydantic-settings",
    "pyyaml",
    "httpx",
    "numpy",
    "lap>=0.5.13",
    "python-multipart>=0.0.32",
]

[project.scripts]
opencam = "opencam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencam"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
